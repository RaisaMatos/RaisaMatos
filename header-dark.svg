<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180" role="img" aria-label="RaisaMatos. Acesso restrito. Nullum crimen sine log.">
  <style>
    text { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
    .nome { font-size: 30px; letter-spacing: 3px; fill: #ece6dc; }
    .frase { font-size: 16px; }
    .apagado { fill: #8a989e; }
    .acento { fill: #d9a05b; }
    .argola { fill: none; stroke: #d9a05b; stroke-width: 2; stroke-linecap: round; }
    .corpo { fill: #d9a05b; }

    .nome { animation: surge 1s ease-out backwards; }
    .cadeado { animation: surge 0.5s ease-out 0.8s backwards; }
    .argola { animation: fecha 0.35s ease-in 1.5s backwards; }
    .l1 { animation: surge 0.6s ease-out 2.0s backwards; }
    .l2 { animation: surge 0.6s ease-out 2.7s backwards; }
    .cursor { fill: #d9a05b; animation: surge 0.1s linear 3.2s backwards, pisca 1.1s steps(1) 3.3s infinite; }

    @keyframes surge { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fecha { from { transform: translateY(-4px); } to { transform: translateY(0); } }
    @keyframes pisca { 0% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <text class="nome" x="400" y="50" text-anchor="middle">RaisaMatos</text>

  <g class="cadeado">
    <path class="argola" d="M394.5 90 V84.5 a5.5 5.5 0 0 1 11 0 V90"/>
    <path class="corpo" fill-rule="evenodd" d="M393.5 90 H406.5 A2.5 2.5 0 0 1 409 92.5 V101.5 A2.5 2.5 0 0 1 406.5 104 H393.5 A2.5 2.5 0 0 1 391 101.5 V92.5 A2.5 2.5 0 0 1 393.5 90 Z M401.8 95.5 A1.8 1.8 0 1 0 398.2 95.5 A1.8 1.8 0 1 0 401.8 95.5 Z M399.25 97.3 H400.75 V100.5 H399.25 Z"/>
  </g>

  <text class="frase apagado l1" x="400" y="136" text-anchor="middle">Acesso restrito.</text>
  <text class="frase acento l2" x="510" y="164" text-anchor="end">Nullum crimen sine log.</text>
  <rect class="cursor" x="514" y="151" width="9" height="17"/>
</svg>
